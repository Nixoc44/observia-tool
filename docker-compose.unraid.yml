# Observia — déploiement Unraid / NAS
# Usage: docker compose -f docker-compose.unraid.yml up -d --build

services:
  backend:
    build: ./server
    container_name: observia-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/observia.db
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      CORS_ORIGINS: '["http://localhost:3080","http://192.168.1.101:3080"]'
      DEBUG: "false"
      MCP_USE_NPX: "false"
    volumes:
      - ${APPDATA_PATH:-./data}:/app/data
    networks:
      - observia
  # Pas de port exposé — le frontend proxy /api/ vers le backend

  frontend:
    build: ./frontend
    container_name: observia-frontend
    restart: unless-stopped
    ports:
      - "${OBSERVIA_PORT:-3080}:80"
    depends_on:
      - backend
    networks:
      - observia

networks:
  observia:
    driver: bridge
